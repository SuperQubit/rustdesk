name: Publish to WinGet
on:
  release:
    types: [released]
  workflow_dispatch:
jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTOMATIONS_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: RustDesk.RustDesk
          version: "1.4.5"
          release-tag: "1.4.5"
          token: ${{ secrets.WINGET_TOKEN }}
